# OWN-FORK BASELINE DIAGNOSTIC TEMPLATE ONLY.
# This workflow is one transport commit above the untouched official Core base
# and exists only to measure the pre-existing Windows test failure signature.
# Do not add it to the upstream PR or release train.
name: AGC-1718 official-base native Windows baseline diagnostic

on:
  push:
    branches: ['wine2e/agc1718-baseline/**']

permissions:
  contents: read

concurrency:
  group: agc1718-native-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline-native:
    name: official Core baseline native Windows diagnostic (own fork)
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      HERMES_TEST_FILE_RETRIES: '0'
    steps:
      - name: Prepare long paths and Git checkout semantics
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config --global core.autocrlf false
          git config --global core.longpaths true
          New-ItemProperty `
            -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' `
            -Name LongPathsEnabled -PropertyType DWord -Value 1 -Force | Out-Null
          $longPaths = (Get-ItemProperty `
            'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem').LongPathsEnabled
          if ($longPaths -ne 1) { throw 'LongPathsEnabled was not set to 1' }
          if ((git config --global --get core.autocrlf) -ne 'false') {
            throw 'core.autocrlf is not false before checkout'
          }

      - name: Checkout official Core base diagnostic commit and its parent
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Build the official locked PM test environment
        id: setup_pm
        uses: ./.github/actions/setup-pm
        with:
          extras: '["messaging"]'
          test-environment: 'true'
          prune-python-cache: true

      - name: Verify official base diagnostic bytes before tests
        id: source_guard_before
        shell: bash
        run: |
          set -euo pipefail
          python .github/proof/agc1718_native_baseline_source_guard.py \
            --manifest .github/proof/agc1718_native_baseline_manifest.json \
            --proof-sha "$GITHUB_SHA" \
            --phase before \
            --receipt "$RUNNER_TEMP/agc1718-baseline/source-before.json"

      - name: Run the complete tui gateway server baseline file on actual Windows
        id: baseline_bank
        if: ${{ !cancelled() && steps.setup_pm.outcome == 'success' && steps.source_guard_before.outcome == 'success' }}
        shell: bash
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/agc1718-baseline"
          mkdir -p "$out"
          set +e
          bash scripts/run_tests.sh -j 1 --file-retries 0 \
            tests/tui_gateway/test_tui_gateway_server.py \
            -- --tb=short --junitxml="$out/test_tui_gateway_server.xml" \
            > "$out/runner.log" 2>&1
          rc=$?
          set -e
          printf 'tests/tui_gateway/test_tui_gateway_server.py exit=%s\n' "$rc" \
            > "$out/file-status.log"
          printf '{"exit_code":%s,"files":1,"file_retries":0,"purpose":"official-base-baseline"}\n' "$rc" \
            > "$out/bank-result.json"
          exit "$rc"

      - name: Verify official base diagnostic bytes after tests
        id: source_guard_after
        if: ${{ always() && steps.setup_pm.outcome == 'success' && steps.source_guard_before.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          python .github/proof/agc1718_native_baseline_source_guard.py \
            --manifest .github/proof/agc1718_native_baseline_manifest.json \
            --proof-sha "$GITHUB_SHA" \
            --phase after \
            --receipt "$RUNNER_TEMP/agc1718-baseline/source-after.json"

      - name: Retain official base baseline receipts
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agc1718-native-baseline-${{ github.sha }}
          path: ${{ runner.temp }}/agc1718-baseline/
          if-no-files-found: error
          retention-days: 14
