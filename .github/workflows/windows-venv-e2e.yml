# OWN-FORK PROOF-BRANCH VARIANT ONLY.
# Keep this file on a wine2e/** proof branch; do not adopt it as a generic
# product workflow without verifying runner capacity and action policy.
name: Windows venv-holder live E2E

# ON-DEMAND ONLY (fleet-update #91277, venv-holder consolidation work).
#
# Runs the live venv-holder E2E suite on a real windows-latest runner:
# spawns actual processes with realistic Hermes argv shapes and drives the
# REAL detection/classification/exemption code against the live process
# table — the coverage that cannot exist on the Linux lanes and that the
# maintainer cannot exercise locally before the work reaches main.
#
# Deliberately NOT wired to pull_request/main: it fires only on pushes to
# wine2e/** working branches, so it costs nothing on normal PRs. Delete or
# keep dormant after the venv-holder work lands.

on:
  push:
    branches:
      - 'wine2e/**'
  workflow_call:
    inputs:
      commit:
        description: Commit to test and build. Empty keeps the triggering commit.
        type: string
        default: ''
      release:
        description: 'Stable-release candidate run. Unused by the jobs; the caller passes it for a uniform callable surface.'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# A workflow_call run (stable release) shares the caller's commit; its group
# includes github.run_id so a rerun of the parent gets a fresh group instead
# of cancelling this child mid-flight. wine2e push runs keep ref-scoped
# collapse as before.
concurrency:
  group: windows-venv-e2e-${{ inputs.release == true && github.run_id || github.ref }}
  cancel-in-progress: ${{ inputs.release != true }}

jobs:
  venv-holder-e2e:
    name: venv-holder live E2E (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          # The stable caller dispatches on the candidate tag; github.sha is
          # the exact candidate commit there and the head SHA everywhere else.
          ref: ${{ inputs.commit || github.sha }}

      - name: Set up locked Python and test dependencies
        id: setup_pm
        uses: ./.github/actions/setup-pm
        with:
          extras: '["messaging"]'
          test-environment: 'true'
          prune-python-cache: true

      - name: Verify frozen source composition before native tests
        shell: bash
        run: python .github/proof/agc1663_source_guard.py

      - name: Run venv-holder live E2E
        # Canonical runner (scripts/run_tests.sh) — never bare pytest: it
        # enforces credential hygiene, TZ, temp HERMES_HOME and subprocess
        # isolation. The live files are host-marked windows-only, so the
        # runner collects them on this runner instead of skipping them.
        shell: bash
        run: |
          set -uo pipefail
          bash scripts/run_tests.sh \
            tests/hermes_cli/test_venv_holder_windows_live.py \
            tests/hermes_cli/test_git_trampoline_windows_live.py \
            tests/pm/test_held_entry_windows_live.py

      - name: Run Windows owner and identity live E2E
        # Collect this independent diagnostic after genuine PM setup even if another test lane fails.
        if: ${{ !cancelled() && steps.setup_pm.outcome == 'success' }}
        # Keep the existing taskkill/process-registry probes in this native
        # owner lane and add the real Job/HostSupervisor proofs. Every file
        # below uses the real Windows process table or Job API; no platform
        # fakes, mocked owner, selector skip, or retry is introduced here. The
        # HostSupervisor producer fixture is a tracked sibling of its test.
        shell: bash
        run: |
          set -uo pipefail
          bash scripts/run_tests.sh \
            tests/hermes_cli/test_taskkill_identity_windows_live.py \
            tests/tools/test_process_registry_windows_live.py \
            tests/gateway/test_refused_owner_windows.py \
            tests/hermes_cli/test_local_runtime_windows_job_owner_live.py \
            tests/tui_gateway/test_host_supervisor_owner_r2.py

      - name: Run producer handle and native owner handoff proof
        if: ${{ !cancelled() && steps.setup_pm.outcome == 'success' }}
        shell: bash
        run: |
          set -uo pipefail
          bash scripts/run_tests.sh -j 2 --file-retries 0 \
            tests/tui_gateway/test_compute_host_producer_completion_r2.py \
            tests/tui_gateway/test_compute_host_producer_completion_r3.py \
            tests/tui_gateway/test_compute_host_producer_completion_gate.py \
            tests/tui_gateway/test_compute_host_producer_payload_binding.py \
            tests/tui_gateway/test_compute_host_producer_real_worker_causal.py \
            tests/tui_gateway/test_compute_host_borrowed_lease.py \
            tests/tui_gateway/test_host_supervisor_owner_r4_causal.py \
            tests/tui_gateway/test_host_supervisor_owner_r5_startup.py \
            tests/tui_gateway/test_host_supervisor_owner_r6_recovery.py \
            tests/tui_gateway/test_host_supervisor_registry_lease_failure.py \
            tests/tui_gateway/test_host_supervisor_owner_r6_cross_supervisor.py

      - name: Record exact native producer identity and post-exit ACK
        if: ${{ !cancelled() && steps.setup_pm.outcome == 'success' }}
        shell: bash
        run: |
          set -uo pipefail
          bash scripts/run_tests.sh -j 1 --file-retries 0 \
            tests/tui_gateway/test_host_supervisor_owner_r7_process_handle.py \
            -- --junitxml=native-owner-identity.xml

      - name: Run real preservation admission and ledger contracts
        if: ${{ !cancelled() && steps.setup_pm.outcome == 'success' }}
        shell: bash
        run: |
          set -uo pipefail
          bash scripts/run_tests.sh -j 2 --file-retries 0 \
            tests/gateway/test_preservation_admission_consumers.py \
            tests/gateway/test_preservation_drain_control.py \
            tests/hermes_state/test_preservation_runtime_snapshot.py \
            tests/gateway/test_runtime_custody_snapshot_contract.py

      - name: Retain native identity receipt
        if: ${{ !cancelled() && steps.setup_pm.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agc1663-native-owner-identity-${{ github.sha }}
          path: native-owner-identity.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Run Telegram CLOSE-WAIT reconnect live E2E (#87057)
        shell: bash
        run: |
          set -uo pipefail
          bash scripts/run_tests.sh tests/gateway/test_telegram_closewait_windows_live.py

      - name: Turn Windows long paths off for later steps (#130242)
        # The runner image turns LongPathsEnabled on; 0 is the Windows default
        # most users have. A process reads the value when it starts, so only
        # later steps see it. Keep this step after every lane that expects the
        # image's setting. It does not depend on those lanes passing.
        id: long_paths_off
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          reg add 'HKLM\SYSTEM\CurrentControlSet\Control\FileSystem' /v LongPathsEnabled /t REG_DWORD /d 0 /f
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          (Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem').LongPathsEnabled

      - name: Run PM long-path live E2E with long paths off (#130242)
        # The test first asserts RtlAreLongPathsEnabled() is false in its own
        # process, so this step cannot pass if the step above did not take.
        # ``-m`` replaces pyproject's addopts, which deselect ``integration``.
        if: ${{ !cancelled() && steps.long_paths_off.outcome == 'success' }}
        shell: bash
        run: |
          set -uo pipefail
          bash scripts/run_tests.sh tests/pm/test_long_paths_windows_live.py -- -m "platforms and integration" -v

      - name: Verify frozen source after all native tests
        if: ${{ !cancelled() && steps.setup_pm.outcome == 'success' }}
        shell: bash
        run: |
          python .github/proof/agc1663_source_guard.py
          git diff --quiet --exit-code
