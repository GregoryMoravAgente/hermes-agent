# OWN-FORK / SOURCE-ONLY AGC-1721 transport template.
# This is a single diagnostic transport commit directly above a qualified
# candidate. It is not upstream product source, release policy, or a package
# proof. Materialize the manifest once, then run this workflow on the own fork.
name: AGC-1721 own-fork Windows deferred-worker diagnostic

on:
  push:
    branches: ['wine2e/agc1721/**']

permissions:
  contents: read

concurrency:
  group: agc1721-native-source-only-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-source-only:
    name: AGC-1721 own-fork native Windows source-only bank
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      HERMES_TEST_FILE_RETRIES: '0'
    steps:
      - name: Configure Windows long paths and checkout semantics
        timeout-minutes: 1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config --global core.autocrlf false
          git config --global core.longpaths true
          New-ItemProperty `
            -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' `
            -Name LongPathsEnabled -PropertyType DWord -Value 1 -Force | Out-Null
          $longPaths = (Get-ItemProperty `
            'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem').LongPathsEnabled
          if ($longPaths -ne 1) { throw 'LongPathsEnabled was not set to 1' }
          if ((git config --global --get core.autocrlf) -ne 'false') {
            throw 'core.autocrlf is not false before checkout'
          }

      - name: Checkout the own-fork transport commit and its direct parent
        timeout-minutes: 1
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Build the official locked PM test environment
        id: setup_pm
        timeout-minutes: 8
        uses: ./.github/actions/setup-pm
        with:
          extras: '["messaging"]'
          test-environment: 'true'
          prune-python-cache: 'false'

      - name: Verify candidate byte closure before tests
        id: source_guard_before
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/agc1721-native-source-only"
          mkdir -p "$out"
          python .github/proof/agc1721_native_windows_source_guard.py \
            --manifest .github/proof/agc1721_native_windows_manifest.json \
            --proof-sha "$GITHUB_SHA" \
            --phase before \
            --receipt "$out/source-before.json"

      - name: Run full target file with contextual native receipt
        id: native_bank
        timeout-minutes: 6
        if: ${{ !cancelled() && steps.setup_pm.outcome == 'success' && steps.source_guard_before.outcome == 'success' }}
        shell: bash
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/agc1721-native-source-only"
          mkdir -p "$out/files"
          python - "$PWD/.github/proof/agc1721_native_windows_manifest.json" "$out/test-files.txt" "$out/target-case.txt" "$out/expected-case-names.json" <<'PY'
          import json
          import pathlib
          import sys

          manifest_path, files_path, case_path, names_path = sys.argv[1:]
          data = json.loads(pathlib.Path(manifest_path).read_text(encoding="utf-8"))
          target_files = data.get("target_test_files")
          target_case = data.get("target_case")
          expected_names = data.get("expected_case_names")
          if data.get("execution_scope") != "full-file-context":
              raise SystemExit("manifest execution_scope must be full-file-context")
          if target_files != ["tests/tui_gateway/test_tui_gateway_server.py"]:
              raise SystemExit("manifest must select exactly the known target test file")
          if target_case != "test_session_resume_deferred_history_acknowledges_and_reuses":
              raise SystemExit("manifest must retain exactly the required trace case")
          if not isinstance(expected_names, list) or len(expected_names) != 660:
              raise SystemExit("manifest must contain exactly 660 expected case names")
          if len(set(expected_names)) != len(expected_names):
              raise SystemExit("manifest expected case names must be unique")
          pathlib.Path(files_path).write_bytes((target_files[0] + "\n").encode("utf-8"))
          pathlib.Path(case_path).write_bytes((target_case + "\n").encode("utf-8"))
          pathlib.Path(names_path).write_bytes(
              (json.dumps(expected_names, ensure_ascii=True, separators=(",", ":")) + "\n").encode("utf-8")
          )
          PY
          if ! python - "$PWD/.github/proof/agc1721_native_windows_manifest.json" "$out/test-files.txt" "$out/target-case.txt" "$out/expected-case-names.json" <<'PY'
          import hashlib
          import json
          import pathlib
          import sys

          manifest_path, list_path, case_path, names_path = sys.argv[1:]
          data = json.loads(pathlib.Path(manifest_path).read_text(encoding="utf-8"))
          expected = data.get("target_test_files")
          expected_case = data.get("target_case")
          expected_names = data.get("expected_case_names")
          if data.get("execution_scope") != "full-file-context":
              raise SystemExit("manifest execution scope is not the complete target-file context")
          if expected != ["tests/tui_gateway/test_tui_gateway_server.py"]:
              raise SystemExit("manifest target scope is not the exact reviewed target file")
          if expected_case != "test_session_resume_deferred_history_acknowledges_and_reuses":
              raise SystemExit("manifest target trace case is not the exact required case")
          if not isinstance(expected_names, list) or len(expected_names) != 660:
              raise SystemExit("manifest expected case list is not exactly 660 names")
          raw = pathlib.Path(list_path).read_bytes()
          cr = raw.count(b"\r")
          lf = raw.count(b"\n")
          crlf = raw.count(b"\r\n")
          if cr != 0 or lf != len(expected) or crlf != 0:
              raise SystemExit(f"invalid Windows test list bytes: CR={cr} LF={lf} expected={len(expected)}")
          actual = raw.decode("utf-8").splitlines()
          if actual != expected:
              raise SystemExit("Windows test list differs from manifest")
          case_raw = pathlib.Path(case_path).read_bytes()
          if case_raw != (expected_case + "\n").encode("utf-8"):
              raise SystemExit("Windows target case differs from manifest")
          names_raw = pathlib.Path(names_path).read_bytes()
          if b"\r" in names_raw:
              raise SystemExit("expected case names contain CR bytes")
          if json.loads(names_raw.decode("utf-8")) != expected_names:
              raise SystemExit("materialized expected case names differ from manifest")
          digest = hashlib.sha256(names_raw.rstrip(b"\n")).hexdigest()
          if digest != data.get("expected_case_names_sha256"):
              raise SystemExit("expected case name digest differs from manifest")
          PY
          then
            echo "Windows full-context input assertion failed" >&2
            exit 1
          fi
          test_path="$(cat "$out/test-files.txt")"
          target_case="$(cat "$out/target-case.txt")"
          junit="$out/files/tests__tui_gateway__test_tui_gateway_server_py.xml"
          runner_log="$out/files/tests__tui_gateway__test_tui_gateway_server_py.runner.log"
          set +e
          bash scripts/run_tests.sh -j 1 --file-timeout 300 --file-retries 0 \
            "$test_path" -- -vv --capture=tee-sys -o junit_logging=system-out \
            -o faulthandler_timeout=45 --tb=short --junitxml="$junit" \
            < /dev/null > "$runner_log" 2>&1
          rc=$?
          set -e
          printf '%s exit=%s\n' "$test_path" "$rc" > "$out/file-status.log"
          overall=0
          if [ "$rc" -ne 0 ]; then
            overall=1
          fi
          junit_count=$(python - "$out/files" <<'PY'
          from pathlib import Path
          import sys
          sys.stdout.reconfigure(newline="\n")
          print(sum(1 for path in Path(sys.argv[1]).glob("*.xml") if path.is_file()))
          PY
          )
          no_test_file_logs=$(python - "$out/files" <<'PY'
          from pathlib import Path
          import sys
          sys.stdout.reconfigure(newline="\n")
          count = 0
          for path in Path(sys.argv[1]).glob("*.runner.log"):
              if "No test files to run" in path.read_text(encoding="utf-8", errors="replace"):
                  count += 1
          print(count)
          PY
          )
          if [ "$junit_count" -ne 1 ]; then
            printf "Expected 1 target-file JUnit file, observed %s\n" "$junit_count" >&2
            overall=1
          fi
          if [ "$no_test_file_logs" -ne 0 ]; then
            printf "Found %s runner logs reporting no test files\n" "$no_test_file_logs" >&2
            overall=1
          fi
          junit_case_check="$out/junit-case-check.json"
          set +e
          python - "$out/files" "$out/expected-case-names.json" "$target_case" "$junit_case_check" <<'PY'
          from collections import Counter
          from pathlib import Path
          import hashlib
          import json
          import sys
          import xml.etree.ElementTree as ET

          files_root, names_path, expected_case, result_path = sys.argv[1:]
          expected_names = json.loads(Path(names_path).read_text(encoding="utf-8"))
          junit_files = sorted(Path(files_root).glob("*.xml"))
          cases = []
          parse_errors = []
          for junit_path in junit_files:
              try:
                  root = ET.parse(junit_path).getroot()
              except (OSError, ET.ParseError):
                  parse_errors.append(junit_path.name)
                  continue
              cases.extend(root.iter("testcase"))
          names = [case.get("name", "") for case in cases]
          failures = sum(1 for case in cases if list(case.iter("failure")))
          errors = sum(1 for case in cases if list(case.iter("error")))
          skipped = sum(1 for case in cases if list(case.iter("skipped")))
          trace = None
          trace_errors = []
          target_cases = [case for case in cases if case.get("name") == expected_case]
          if len(target_cases) != 1:
              trace_errors.append("target case is not unique in JUnit")
          else:
              for output in target_cases[0].iter("system-out"):
                  for line in (output.text or "").splitlines():
                      line = line.strip()
                      if line.startswith("AGC1721_DEFERRED_HISTORY_TRACE="):
                          try:
                              trace = json.loads(line.split("=", 1)[1])
                          except json.JSONDecodeError:
                              trace_errors.append("target trace JSON is malformed")
                          break
                  if trace is not None:
                      break
          if trace is None:
              trace_errors.append("target trace JSON is missing")
          else:
              if trace.get("history_worker_class") != "threading.Thread":
                  trace_errors.append("history worker class is not threading.Thread")
              for key in ("history_worker_is_captured_real", "history_worker_wait_succeeded", "first_return_before_worker_wait_exit"):
                  if trace.get(key) is not True:
                      trace_errors.append(f"trace boolean {key} is not true")
              if trace.get("history_worker_is_main") is not False:
                  trace_errors.append("history worker is unexpectedly the main thread")
              ordered = [
                  "test_enter_ns",
                  "history_worker_enter_ns",
                  "history_worker_wait_enter_ns",
                  "first_return_ns",
                  "history_started_observed_ns",
                  "second_call_enter_ns",
                  "second_return_ns",
                  "release_before_ns",
                  "release_after_ns",
                  "history_worker_wait_exit_ns",
                  "resume_history_ready_observed_ns",
                  "cleanup_complete_ns",
              ]
              values = []
              for key in ordered:
                  value = trace.get(key)
                  if isinstance(value, bool) or not isinstance(value, int):
                      trace_errors.append(f"trace ordering field {key} is not an integer")
                  else:
                      values.append(value)
              # Independent threads have no total scheduling order. Check only
              # edges established by program order or the real Event handoff.
              causal_chains = [
                  ["test_enter_ns", "first_return_ns", "history_started_observed_ns",
                   "second_call_enter_ns", "second_return_ns", "release_before_ns",
                   "release_after_ns", "resume_history_ready_observed_ns", "cleanup_complete_ns"],
                  ["test_enter_ns", "history_worker_enter_ns", "history_worker_wait_enter_ns",
                   "history_worker_wait_exit_ns", "resume_history_ready_observed_ns"],
                  ["history_worker_enter_ns", "history_started_observed_ns"],
                  ["release_before_ns", "history_worker_wait_exit_ns"],
                  ["first_return_ns", "history_worker_wait_exit_ns"],
              ]
              if len(values) == len(ordered):
                  for chain in causal_chains:
                      if any(trace[a] > trace[b] for a, b in zip(chain, chain[1:])):
                          trace_errors.append("trace violates a causal ordering edge: " + " -> ".join(chain))
          result = {
              "schema": "agc1721.native_windows_full_context_junit_check.r1.v1",
              "execution_scope": "full-file-context",
              "expected_case": expected_case,
              "expected_case_count": len(expected_names),
              "expected_case_names_sha256": hashlib.sha256(
                  json.dumps(expected_names, ensure_ascii=True, separators=(",", ":")).encode("utf-8")
              ).hexdigest(),
              "junit_files": len(junit_files),
              "case_count": len(cases),
              "case_names_sha256": hashlib.sha256(
                  json.dumps(names, ensure_ascii=True, separators=(",", ":")).encode("utf-8")
              ).hexdigest(),
              "case_names_match": Counter(names) == Counter(expected_names),
              "failure_count": failures,
              "error_count": errors,
              "skipped_count": skipped,
              "parse_errors": parse_errors,
              "target_trace_present": trace is not None,
              "target_trace_valid": not trace_errors,
              "trace_errors": trace_errors,
              "trace": trace,
          }
          Path(result_path).write_text(json.dumps(result, indent=2) + "\n", encoding="utf-8")
          if (
              len(junit_files) != 1
              or len(cases) != len(expected_names)
              or Counter(names) != Counter(expected_names)
              or parse_errors
              or failures
              or errors
              or skipped
              or trace_errors
          ):
              raise SystemExit("JUnit must contain the exact 660-case context with a valid target trace")
          PY
          junit_case_check_rc=$?
          set -e
          if [ "$junit_case_check_rc" -ne 0 ]; then
            overall=1
          fi
          junit_case_count=$(python - "$junit_case_check" <<'PY'
          import json, sys
          print(json.load(open(sys.argv[1], encoding="utf-8")).get("case_count", 0))
          PY
          )
          junit_failure_count=$(python - "$junit_case_check" <<'PY'
          import json, sys
          print(json.load(open(sys.argv[1], encoding="utf-8")).get("failure_count", 0))
          PY
          )
          junit_error_count=$(python - "$junit_case_check" <<'PY'
          import json, sys
          print(json.load(open(sys.argv[1], encoding="utf-8")).get("error_count", 0))
          PY
          )
          junit_skipped_count=$(python - "$junit_case_check" <<'PY'
          import json, sys
          print(json.load(open(sys.argv[1], encoding="utf-8")).get("skipped_count", 0))
          PY
          )
          case_names_match=$(python - "$junit_case_check" <<'PY'
          import json, sys
          print("true" if json.load(open(sys.argv[1], encoding="utf-8")).get("case_names_match") else "false")
          PY
          )
          target_trace_valid=$(python - "$junit_case_check" <<'PY'
          import json, sys
          print("true" if json.load(open(sys.argv[1], encoding="utf-8")).get("target_trace_valid") else "false")
          PY
          )
          if [ "$junit_failure_count" -ne 0 ] || [ "$junit_error_count" -ne 0 ] || [ "$junit_skipped_count" -ne 0 ] || [ "$case_names_match" != "true" ] || [ "$target_trace_valid" != "true" ]; then
            overall=1
          fi
          python - "$out/bank-result.json" "$overall" "$rc" "$junit_count" "$junit_case_count" "$junit_failure_count" "$junit_error_count" "$junit_skipped_count" "$junit_case_check_rc" "$case_names_match" "$target_trace_valid" "$target_case" <<'PY'
          import json, sys
          (
              path,
              overall,
              runner_exit,
              junit_count,
              junit_case_count,
              junit_failure_count,
              junit_error_count,
              junit_skipped_count,
              junit_case_check_rc,
              case_names_match,
              target_trace_valid,
              target_case,
          ) = sys.argv[1:]
          json.dump({
              "schema": "agc1721.native_windows_full_context_bank_result.r1.v1",
              "execution_scope": "full-file-context",
              "file_retries": 0,
              "target_test_files": ["tests/tui_gateway/test_tui_gateway_server.py"],
              "target_case": target_case,
              "expected_case_count": 660,
              "expected_skip_count": 0,
              "files": 1,
              "runner_exit_code": int(runner_exit),
              "exit_code": int(overall),
              "expected_per_file_junit": 1,
              "per_file_junit": int(junit_count),
              "junit_case_count": int(junit_case_count),
              "junit_failure_count": int(junit_failure_count),
              "junit_error_count": int(junit_error_count),
              "junit_skipped_count": int(junit_skipped_count),
              "junit_case_check_exit": int(junit_case_check_rc),
              "case_names_match": case_names_match == "true",
              "target_trace_valid": target_trace_valid == "true",
              "per_file_runner_logs": True,
              "runner_trace_retained": True,
              "faulthandler_timeout_seconds": 45,
              "cr_bytes_checked": True,
              "lf_bytes_checked": True,
          }, open(path, "w", encoding="utf-8"), indent=2)
          PY
          exit "$overall"

      - name: Verify candidate byte closure after tests
        id: source_guard_after
        timeout-minutes: 1
        if: ${{ always() && steps.setup_pm.outcome == 'success' && steps.source_guard_before.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/agc1721-native-source-only"
          python .github/proof/agc1721_native_windows_source_guard.py \
            --manifest .github/proof/agc1721_native_windows_manifest.json \
            --proof-sha "$GITHUB_SHA" \
            --phase after \
            --receipt "$out/source-after.json" \
            --baseline-receipt "$out/source-before.json"

      - name: Retain per-file JUnit, runner logs, and guards
        timeout-minutes: 2
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agc1721-native-source-only-${{ github.sha }}
          path: ${{ runner.temp }}/agc1721-native-source-only/
          if-no-files-found: error
          retention-days: 14
