# OWN-FORK / SOURCE-ONLY AGC-1721 transport template.
# This is a single diagnostic transport commit directly above a qualified
# candidate. It is not upstream product source, release policy, or a package
# proof. Materialize the manifest once, then run this workflow on the own fork.
name: AGC-1721 own-fork native Windows and Linux source-only proof

on:
  push:
    branches: ['wine2e/agc1721/**']

permissions:
  contents: read

concurrency:
  group: agc1721-native-source-only-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-source-only:
    name: AGC-1721 own-fork native Windows source-only bank
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      HERMES_TEST_FILE_RETRIES: '0'
    steps:
      - name: Configure Windows long paths and checkout semantics
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config --global core.autocrlf false
          git config --global core.longpaths true
          New-ItemProperty `
            -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' `
            -Name LongPathsEnabled -PropertyType DWord -Value 1 -Force | Out-Null
          $longPaths = (Get-ItemProperty `
            'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem').LongPathsEnabled
          if ($longPaths -ne 1) { throw 'LongPathsEnabled was not set to 1' }
          if ((git config --global --get core.autocrlf) -ne 'false') {
            throw 'core.autocrlf is not false before checkout'
          }

      - name: Checkout the own-fork transport commit and its direct parent
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Build the official locked PM test environment
        id: setup_pm
        uses: ./.github/actions/setup-pm
        with:
          extras: '["messaging"]'
          test-environment: 'true'
          prune-python-cache: true

      - name: Verify candidate byte closure before tests
        id: source_guard_before
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/agc1721-native-source-only"
          mkdir -p "$out"
          python .github/proof/agc1721_native_windows_source_guard.py \
            --manifest .github/proof/agc1721_native_windows_manifest.json \
            --proof-sha "$GITHUB_SHA" \
            --phase before \
            --receipt "$out/source-before.json"

      - name: Run every selected native test file with an individual receipt
        id: native_bank
        if: ${{ !cancelled() && steps.setup_pm.outcome == 'success' && steps.source_guard_before.outcome == 'success' }}
        shell: bash
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/agc1721-native-source-only"
          mkdir -p "$out/files"
          python - "$PWD/.github/proof/agc1721_native_windows_manifest.json" > "$out/test-files.txt" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          sys.stdout.reconfigure(newline="\n")
          for entry in data["test_files"]:
              print(entry["path"])
          PY
          if ! python - "$PWD/.github/proof/agc1721_native_windows_manifest.json" "$out/test-files.txt" <<'PY'
          import json, pathlib, sys
          manifest_path, list_path = sys.argv[1:]
          expected = [entry["path"] for entry in json.loads(pathlib.Path(manifest_path).read_text(encoding="utf-8"))["test_files"]]
          raw = pathlib.Path(list_path).read_bytes()
          cr = raw.count(b"\r")
          lf = raw.count(b"\n")
          crlf = raw.count(b"\r\n")
          if cr != 0 or lf != len(expected) or crlf != 0:
              raise SystemExit(f"invalid Windows test list bytes: CR={cr} LF={lf} expected={len(expected)}")
          actual = raw.decode("utf-8").splitlines()
          if actual != expected:
              raise SystemExit("Windows test list differs from manifest")
          PY
          then
            echo "Windows test list byte assertion failed" >&2
            exit 1
          fi
          overall=0
          total=0
          failed=0
          : > "$out/file-status.log"
          while IFS= read -r test_path; do
            [ -n "$test_path" ] || continue
            total=$((total + 1))
            label="${test_path//\//__}"
            label="${label//./_}"
            junit="$out/files/${label}.xml"
            runner_log="$out/files/${label}.runner.log"
            set +e
            bash scripts/run_tests.sh -j 1 --file-retries 0 \
              "$test_path" -- --tb=short --junitxml="$junit" \
              < /dev/null > "$runner_log" 2>&1
            rc=$?
            set -e
            printf '%s exit=%s\n' "$test_path" "$rc" >> "$out/file-status.log"
            if [ "$rc" -ne 0 ]; then
              overall=1
              failed=$((failed + 1))
            fi
          done < "$out/test-files.txt"
          junit_count=$(python - "$out/files" <<'PY'
          from pathlib import Path
          import sys
          sys.stdout.reconfigure(newline="\n")
          print(sum(1 for path in Path(sys.argv[1]).glob("*.xml") if path.is_file()))
          PY
          )
          no_test_file_logs=$(python - "$out/files" <<'PY'
          from pathlib import Path
          import sys
          sys.stdout.reconfigure(newline="\n")
          count = 0
          for path in Path(sys.argv[1]).glob("*.runner.log"):
              if "No test files to run" in path.read_text(encoding="utf-8", errors="replace"):
                  count += 1
          print(count)
          PY
          )
          if [ "$total" -ne 40 ]; then
            printf "Expected 40 test files, executed %s\n" "$total" >&2
            overall=1
          fi
          if [ "$junit_count" -ne 40 ]; then
            printf "Expected 40 per-file JUnit files, observed %s\n" "$junit_count" >&2
            overall=1
          fi
          if [ "$no_test_file_logs" -ne 0 ]; then
            printf "Found %s runner logs reporting no test files\n" "$no_test_file_logs" >&2
            overall=1
          fi
          python - "$out/bank-result.json" "$total" "$failed" "$overall" "$junit_count" "$no_test_file_logs" <<'PY'
          import json, sys
          path, total, failed, overall, junit_count, no_test_file_logs = sys.argv[1:]
          json.dump({
              "schema": "agc1721.native_windows_source_only_bank_result.r2.v1",
              "file_retries": 0,
              "expected_files": 40,
              "files": int(total),
              "failed_files": int(failed),
              "exit_code": int(overall),
              "expected_per_file_junit": 40,
              "per_file_junit": int(junit_count),
              "no_test_file_logs": int(no_test_file_logs),
              "per_file_runner_logs": True,
              "cr_bytes_checked": True,
              "lf_bytes_checked": True,
          }, open(path, "w", encoding="utf-8"), indent=2)
          PY
          exit "$overall"

      - name: Verify candidate byte closure after tests
        id: source_guard_after
        if: ${{ always() && steps.setup_pm.outcome == 'success' && steps.source_guard_before.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/agc1721-native-source-only"
          python .github/proof/agc1721_native_windows_source_guard.py \
            --manifest .github/proof/agc1721_native_windows_manifest.json \
            --proof-sha "$GITHUB_SHA" \
            --phase after \
            --receipt "$out/source-after.json" \
            --baseline-receipt "$out/source-before.json"

      - name: Retain per-file JUnit, runner logs, and guards
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agc1721-native-source-only-${{ github.sha }}
          path: ${{ runner.temp }}/agc1721-native-source-only/
          if-no-files-found: error
          retention-days: 14

  native-linux-source-only:
    name: AGC-1721 own-fork canonical Linux 704-file source-only bank
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      HERMES_TEST_FILE_RETRIES: '0'
    steps:
      - name: Checkout the own-fork transport commit and its direct parent
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Build the official locked PM test environment
        id: setup_pm
        uses: ./.github/actions/setup-pm
        with:
          extras: '["messaging"]'
          test-environment: 'true'
          prune-python-cache: true

      - name: Verify candidate byte closure before Linux tests
        id: linux_source_guard_before
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/agc1721-native-linux-source-only"
          mkdir -p "$out"
          python .github/proof/agc1721_native_windows_source_guard.py \
            --manifest .github/proof/agc1721_native_windows_manifest.json \
            --proof-sha "$GITHUB_SHA" \
            --phase before \
            --receipt "$out/source-before.json"

      - name: Run exactly one canonical 704-file Linux bank
        id: linux_bank
        if: ${{ !cancelled() && steps.setup_pm.outcome == 'success' && steps.linux_source_guard_before.outcome == 'success' }}
        shell: bash
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/agc1721-native-linux-source-only"
          mkdir -p "$out"
          python - "$PWD/.github/proof/agc1721_native_windows_manifest.json" "$out/linux-test-files.txt" <<'PY'
          import json, pathlib, sys
          manifest_path, list_path = sys.argv[1:]
          paths = json.loads(pathlib.Path(manifest_path).read_text(encoding="utf-8"))["linux_test_files"]
          pathlib.Path(list_path).write_bytes(("\n".join(paths) + "\n").encode("utf-8"))
          PY
          if ! python - "$out/linux-test-files.txt" <<'PY'
          from pathlib import Path
          import sys
          raw = Path(sys.argv[1]).read_bytes()
          lines = raw.decode("utf-8").splitlines()
          cr = raw.count(b"\r")
          lf = raw.count(b"\n")
          crlf = raw.count(b"\r\n")
          if cr != 0 or lf != 704 or crlf != 0:
              raise SystemExit(f"invalid Linux test list bytes: CR={cr} LF={lf} expected=704")
          if len(lines) != 704 or len(set(lines)) != 704:
              raise SystemExit("Linux test list is not exactly 704 unique paths")
          PY
          then
            echo "Linux test list byte assertion failed" >&2
            exit 1
          fi
          set +e
          bash scripts/run_tests.sh -j 2 --file-retries 0 \
            --files-from="$out/linux-test-files.txt" -- --tb=short \
            < /dev/null > "$out/linux-run.stdout" 2> "$out/linux-run.stderr"
          runner_rc=$?
          set -e
          python - "$out/linux-run.stdout" "$out/linux-run.stderr" "$out/linux-summary.json" "$out/linux-junit-summary.xml" "$runner_rc" <<'PY'
          import json, re, sys
          from pathlib import Path
          stdout = Path(sys.argv[1]).read_text(encoding="utf-8", errors="replace")
          stderr = Path(sys.argv[2]).read_text(encoding="utf-8", errors="replace")
          result_path, junit_path, runner_rc = Path(sys.argv[3]), Path(sys.argv[4]), int(sys.argv[5])
          combined = stdout + "\n" + stderr
          summary_lines = [line for line in combined.splitlines() if line.startswith("=== Summary:")]
          match = re.search(r"=== Summary: (?P<files>\d+) files, (?P<passed>\d+) tests passed, (?P<failed>\d+) failed", combined)
          observed_files = int(match.group("files")) if match else None
          passed = int(match.group("passed")) if match else None
          failed = int(match.group("failed")) if match else None
          skipped_match = re.search(r"(?P<skipped>\d+) skipped", summary_lines[0] if len(summary_lines) == 1 else "")
          skipped = int(skipped_match.group("skipped")) if skipped_match else 0
          valid_summary = len(summary_lines) == 1 and observed_files == 704
          no_test_files = "No test files to run" in combined
          result = {
              "schema": "agc1721.native_linux_source_only_bank_result.r2.v1",
              "expected_files": 704,
              "observed_files": observed_files,
              "tests_passed": passed,
              "tests_failed": failed,
              "tests_skipped": skipped,
              "runner_exit_code": runner_rc,
              "summary_lines": summary_lines,
              "summary_valid": valid_summary,
              "no_test_files_to_run": no_test_files,
              "file_retries": 0,
              "jobs": 2,
              "stderr_bytes": len(stderr.encode("utf-8")),
              "junit_summary_is_runner_mirror": True,
              "raw_pytest_junit": False,
          }
          result_path.write_text(json.dumps(result, indent=2) + "\n", encoding="utf-8")
          junit = (
              '<?xml version="1.0" encoding="UTF-8"?>\n'
              '<testsuite name="agc1721-linux-704-file-bank" '
              'schema="agc1721.runner-summary-mirror.r1" '
              'raw_pytest_junit="false" '
              f'files="{observed_files if observed_files is not None else ""}" '
              f'tests_passed="{passed if passed is not None else ""}" '
              f'tests_failed="{failed if failed is not None else ""}" '
              f'tests_skipped="{skipped}" '
              f'runner_exit_code="{runner_rc}" />\n'
          )
          junit_path.write_text(junit, encoding="utf-8")
          if not valid_summary or no_test_files:
              raise SystemExit("Linux bank summary did not prove exactly 704 collected file runs")
          if runner_rc != 0:
              raise SystemExit(runner_rc)
          PY

      - name: Verify candidate byte closure after Linux tests
        id: linux_source_guard_after
        if: ${{ always() && steps.setup_pm.outcome == 'success' && steps.linux_source_guard_before.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/agc1721-native-linux-source-only"
          python .github/proof/agc1721_native_windows_source_guard.py \
            --manifest .github/proof/agc1721_native_windows_manifest.json \
            --proof-sha "$GITHUB_SHA" \
            --phase after \
            --receipt "$out/source-after.json" \
            --baseline-receipt "$out/source-before.json"

      - name: Retain Linux summary, stderr mirror, and guards
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agc1721-native-linux-source-only-${{ github.sha }}
          path: ${{ runner.temp }}/agc1721-native-linux-source-only/
          if-no-files-found: error
          retention-days: 14
