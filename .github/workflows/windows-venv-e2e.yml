# OWN-FORK PROOF-BRANCH VARIANT ONLY: never adopt this narrowed workflow upstream.
name: Exporter native Windows component proof
on:
  push:
    branches: ['wine2e/**']
permissions:
  contents: read
concurrency:
  group: exporter-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  exporter-native:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      HERMES_TEST_FILE_RETRIES: '0'
    steps:
      - name: Checkout frozen proof head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build the official locked PM test environment
        id: setup_pm
        uses: ./.github/actions/setup-pm
        with:
          extras: '["messaging"]'
          test-environment: 'true'
          prune-python-cache: true
      - name: Verify frozen exporter source and runner inputs
        id: source_guard
        shell: bash
        run: python .github/proof/agc1663_exporter_source_guard.py
      - name: Run exporter component bank on actual Windows
        if: ${{ !cancelled() && steps.setup_pm.outcome == 'success' && steps.source_guard.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/run_tests.sh -j 2 --file-retries 0 \
            tests/cron/test_complete_export.py \
            tests/cron/test_complete_export_fences.py \
            tests/cron/test_complete_export_sources.py \
            tests/cron/test_complete_export_sqlite_refusals.py \
            tests/cron/test_export_writer_custody.py \
            tests/cron/test_file_writer_jobs_custody.py \
            tests/cron/test_file_writer_monitor_custody.py \
            tests/cron/test_file_writer_profile_custody.py \
            tests/hermes_state/test_complete_export.py \
            tests/hermes_state/test_complete_export_schema30_optional.py \
            tests/hermes_state/test_preservation_receipt_budget_order.py \
            tests/hermes_state/test_preservation_runtime_relation_shadow.py \
            tests/hermes_state/test_preservation_runtime_snapshot.py \
            tests/test_hermes_cron_export_custody.py \
            tests/tui_gateway/test_profiles_list_canonical_session.py \
            -- --tb=short
      - name: Run actual Windows junction and lock-release controls
        if: ${{ !cancelled() && steps.setup_pm.outcome == 'success' && steps.source_guard.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/run_tests.sh -j 1 --file-retries 0 \
            tests/test_hermes_cron_custody_windows.py \
            -- --junitxml=native-exporter-namespace.xml --tb=short
      - name: Verify source after native execution
        if: ${{ !cancelled() && steps.setup_pm.outcome == 'success' && steps.source_guard.outcome == 'success' }}
        shell: bash
        run: |
          python .github/proof/agc1663_exporter_source_guard.py
          git diff --quiet --exit-code
      - name: Retain native namespace receipt
        if: ${{ !cancelled() && steps.setup_pm.outcome == 'success' && steps.source_guard.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: exporter-native-namespace-${{ github.sha }}
          path: native-exporter-namespace.xml
          if-no-files-found: error
          retention-days: 14
