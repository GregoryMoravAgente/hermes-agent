# OWN-FORK PROOF-BRANCH TEMPLATE ONLY.
# This file is the first of exactly one transport commit above the public
# candidate. Materialize the manifest source hashes before committing it to a
# wine2e/agc1718/** branch. Do not add it to the upstream PR or release train.
name: AGC-1718 profile fencing native Windows proof

on:
  push:
    branches: ['wine2e/agc1718/**']

permissions:
  contents: read

concurrency:
  group: agc1718-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  profile-fencing-native:
    name: profile fencing native Windows (own fork)
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      HERMES_TEST_FILE_RETRIES: '0'
    steps:
      - name: Prepare long paths and Git checkout semantics
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config --global core.autocrlf false
          git config --global core.longpaths true
          New-ItemProperty `
            -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' `
            -Name LongPathsEnabled -PropertyType DWord -Value 1 -Force | Out-Null
          $longPaths = (Get-ItemProperty `
            'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem').LongPathsEnabled
          if ($longPaths -ne 1) { throw 'LongPathsEnabled was not set to 1' }
          if ((git config --global --get core.autocrlf) -ne 'false') {
            throw 'core.autocrlf is not false before checkout'
          }

      - name: Checkout proof commit and its public parent
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Build the official locked PM test environment
        id: setup_pm
        uses: ./.github/actions/setup-pm
        with:
          extras: '["messaging"]'
          test-environment: 'true'
          prune-python-cache: true

      - name: Verify proof commit and executable candidate bytes before tests
        id: source_guard_before
        shell: bash
        run: |
          set -euo pipefail
          python .github/proof/agc1718_profile_source_guard.py \
            --manifest .github/proof/agc1718_profile_native_manifest.json \
            --proof-sha "$GITHUB_SHA" \
            --phase before \
            --receipt "$RUNNER_TEMP/agc1718/source-before.json"

      - name: Run the ten-file profile fencing bank on actual Windows
        id: focused_bank
        if: ${{ !cancelled() && steps.setup_pm.outcome == 'success' && steps.source_guard_before.outcome == 'success' }}
        shell: bash
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/agc1718"
          mkdir -p "$out"
          files=(
            tests/tui_gateway/test_compute_host_profile_fencing.py
            tests/tui_gateway/test_compute_host_profile_ownership.py
            tests/tui_gateway/test_compute_host.py
            tests/tui_gateway/test_compute_host_turn_protocol.py
            tests/tui_gateway/test_compute_host_late_compress_ack.py
            tests/tui_gateway/test_interrupt_dead_compute_host.py
            tests/tui_gateway/test_served_profile_child_env.py
            tests/tui_gateway/test_served_profile_child_env_authority.py
            tests/tui_gateway/test_compute_host_borrowed_lease.py
            tests/tui_gateway/test_tui_gateway_server.py
          )
          rc=0
          : > "$out/runner.log"
          for file in "${files[@]}"; do
            stem="${file##*/}"
            stem="${stem%.py}"
            set +e
            bash scripts/run_tests.sh -j 1 --file-retries 0 "$file" \
              -- --tb=short --junitxml="$out/${stem}.xml" \
              >> "$out/runner.log" 2>&1
            file_rc=$?
            set -e
            printf '%s exit=%s\n' "$file" "$file_rc" >> "$out/file-status.log"
            if [ "$file_rc" -ne 0 ]; then rc=1; fi
          done
          printf '{"exit_code":%s,"files":10,"file_retries":0}\n' "$rc" > "$out/bank-result.json"
          exit "$rc"

      - name: Verify proof commit and executable candidate bytes after tests
        id: source_guard_after
        if: ${{ always() && steps.setup_pm.outcome == 'success' && steps.source_guard_before.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          python .github/proof/agc1718_profile_source_guard.py \
            --manifest .github/proof/agc1718_profile_native_manifest.json \
            --proof-sha "$GITHUB_SHA" \
            --phase after \
            --receipt "$RUNNER_TEMP/agc1718/source-after.json"

      - name: Retain native profile fencing receipts
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agc1718-profile-fencing-native-${{ github.sha }}
          path: ${{ runner.temp }}/agc1718/
          if-no-files-found: error
          retention-days: 14
